name: android

on:
  push:
    branches: [main]
    paths: ["android/**", "src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "src/**", "Cargo.toml", "Cargo.lock"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK r27
        run: sdkmanager "ndk;27.0.12077973" "platforms;android-34" "build-tools;34.0.0"
      - name: Autotools for opus
        run: brew install autoconf automake libtool
      - name: Rust unit tests (host)

        run: cargo test --lib --offline
      - name: Build Rust .so + APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          ./android/build-rust.sh release
          cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telecomfort-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
